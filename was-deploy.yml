apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-petclinic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-petclinic
    spec:
      containers:
      - name: spring-petclinic
        image: ehddl0220/spring-petclinic:latest
        env:
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: /petclinic
