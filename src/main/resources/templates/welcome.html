<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <h2 th:text="#{welcome}">Welcome</h2>
  <div class="row">
    <div class="col-md-12">
      <img class="img-responsive" src="../static/resources/images/pets.png" th:src="@{/resources/images/pets.png}" />
    </div>
  </div>

  <div class="row" style="margin-bottom: 20px;">
    <div class="col-md-12">
      <div class="alert alert-info">
        <strong>[로드밸런싱 확인]</strong> 
        서버 IP: <span th:text="${T(java.net.InetAddress).getLocalHost().getHostAddress()}">127.0.0.1</span> | 
        파드 이름: <span th:text="${T(java.net.InetAddress).getLocalHost().getHostName()}">localhost</span>
      </div>
    </div>
  </div>

  <div class="row">
  
</body>

</html>
